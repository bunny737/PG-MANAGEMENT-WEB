services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap superuser — for admin only. The app connects as the
      # non-superuser app_user (created by init.sql) because Postgres
      # superusers bypass Row-Level Security.
      POSTGRES_DB: pg_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-app-user.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      # Backend secrets (e.g. the Firebase service-account JSON), read-only.
      # ./secrets is gitignored; FIREBASE_CREDENTIALS_PATH must use the
      # container path, e.g. /run/secrets/firebase-service-account.json.
      - ./secrets:/run/secrets:ro
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - ./secrets:/run/secrets:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    restart: unless-stopped
    # DatabaseScheduler (django_celery_beat) so PeriodicTask schedules are
    # Super-Admin-editable via Django admin — no deploy to change cadence
    # (see Module 14 spec: recurring notification sweeps).
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
      - ./secrets:/run/secrets:ro
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      # Read-only: src/lib/__tests__/featureText.test.ts asserts the frontend's
      # feature-text normaliser against the backend's own fixture, so the two
      # can never silently disagree (see that test's comment).
      - ./backend/apps/properties/tests/fixtures:/backend/apps/properties/tests/fixtures:ro
      # Same idea for the BFF origin signature: src/lib/server/__tests__/originSignature.test.ts
      # asserts the vectors Django's apps/core/test_net.py asserts (docs/deployment.md, WP7).
      - ./backend/apps/core/tests_fixtures:/backend/apps/core/tests_fixtures:ro
    environment:
      # Server-side only: the BFF proxy (frontend/src/app/api) and the marketing site's fetches call Django
      # from inside this container, where localhost is not Django. The browser only ever talks to this app.
      - INTERNAL_API_URL=http://backend:8000
      # Dev only: hosts other than localhost that open the dev server (ngrok tunnel, phone on the LAN).
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-}
      # Largest request body the BFF proxy will buffer, in bytes (default 10 MB, same as the app's own default).
      - BFF_MAX_BODY_BYTES=${BFF_MAX_BODY_BYTES:-10485760}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      - NEXT_PUBLIC_FIREBASE_VAPID_KEY=${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

volumes:
  pgdata:
