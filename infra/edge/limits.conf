# Rate-limit keys for the auth endpoints. Installed by setup-edge.sh as /etc/nginx/conf.d/00-pglive-limits.conf
# (the 00- prefix matters: a zone must be declared before the config that uses it).
#
# api.pglive.in/api/v1/auth/ sees two kinds of caller, and a per-peer-IP limit fits only one of them:
#   - direct clients (the future mobile apps, scripts): the peer address IS the client, so limit per peer IP;
#   - the web BFF (Next.js on Cloud Run): every browser arrives from Cloud Run's egress addresses, so a per-peer
#     limit would throttle all users together. Limit per BROWSER IP instead, which the BFF passes in
#     X-PGLive-Origin-IP.
# That header is client-supplied, so it is only believed from a caller that proves it is the BFF by presenting the
# edge key (X-PGLive-Edge-Key, exact match against /etc/nginx/pglive-edge-key.map). Anything else, including a
# forged signature header or a wrong key, is counted against its own peer IP like any direct client: sending
# spoofed headers never gets a caller out of the limit. Django still verifies the signed origin IP itself
# (apps.core.net); this file only decides which counter a request lands in.

# Edge keys are long (openssl rand -hex 32 = 64 chars); nginx's default map hash bucket is too small for that.
map_hash_bucket_size 128;

map $http_x_pglive_edge_key $is_bff {
    default 0;
    include /etc/nginx/pglive-edge-key.map;     # lines of the form:  "<key>" 1;
}

# The BFF's reported browser IP; if it sent none, its own address (Cloud Run egress) is the best key left.
map $http_x_pglive_origin_ip $bff_client {
    ""      $remote_addr;
    default $http_x_pglive_origin_ip;
}

map $is_bff $direct_key {      # empty key = "not counted in this zone"
    1       "";
    default $binary_remote_addr;
}
map $is_bff $bff_key {
    1       $bff_client;
    default "";
}

limit_req_zone $binary_remote_addr zone=pglive_auth:10m        rate=60r/m;    # www.pglive.in/api/auth/ (peer = browser)
limit_req_zone $direct_key         zone=pglive_auth_direct:10m rate=60r/m;    # api: direct clients
limit_req_zone $bff_key            zone=pglive_auth_bff:10m    rate=600r/m;   # api: BFF, per browser (me + refresh ride it)
limit_req_status 429;
