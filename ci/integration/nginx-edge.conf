# Stand-in for the Google load balancer in front of Django (see docker-compose.yml).
server {
    listen 80;
    location / {
        # No URI on proxy_pass: the request target goes upstream exactly as received,
        # so Django's RAW_URI is what the BFF signed.
        proxy_pass http://api:8080;
        proxy_set_header Host api.pglive.in;
        proxy_set_header X-Forwarded-Proto https;
        # Like the LB's custom header: overwrite, never append to, the client's value.
        proxy_set_header X-PGLive-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }
}
