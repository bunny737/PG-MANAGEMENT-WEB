name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:        # deploy-prod.yml runs the full suite before any production release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rootpw
          POSTGRES_DB: pg_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: rootpw
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: localhost
      DB_USER: app_user
      DB_PASSWORD: app_password
      SECRET_KEY: ci-only-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: System libraries (WeasyPrint, gettext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 gettext graphviz
      - run: pip install -r requirements/dev.txt
      # Mirrors docker/postgres/init.sql: a NON-superuser (superusers bypass RLS) that may create the test DB.
      - name: Create the test role
        run: |
          psql -d postgres -c "CREATE ROLE app_user LOGIN PASSWORD 'app_password' NOSUPERUSER CREATEDB"
          psql -d pg_platform -c "GRANT ALL ON SCHEMA public TO app_user"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput --parallel 4
      - name: Pre-traffic smoke script
        run: python -m unittest scripts.test_smoke

  database-roles:
    # The production role model: migrations as the owner, runtime as a role that owns nothing.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: rootpw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: rootpw
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: localhost
      SECRET_KEY: ci-only-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 gettext
      - run: pip install -r requirements/dev.txt
      - run: psql -d postgres -v migration_password=migpw -v app_password=apppw -v db_name=pg_platform -f ../infra/sql/roles-1-roles.sql
      - run: DB_USER=migration_user DB_PASSWORD=migpw python manage.py migrate --noinput
      - run: psql -d pg_platform -f ../infra/sql/roles-2-grants.sql
      - run: DB_USER=app_user DB_PASSWORD=apppw python manage.py check_db_roles --role app_user

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build (staging config, not public)
        run: npm run build
        env:
          SITE_ENV: staging
          SITE_URL: https://staging.example.test

  images:
    # Builds both production images, runs the Telugu-font test inside the backend one, and exercises the
    # BFF -> gunicorn origin signature through real servers (ci/integration/run.sh).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t pglive-api:local backend
      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile.prod -t pglive-web:local \
            --build-arg SITE_URL=https://www.pglive.in \
            --build-arg COMPANY_NAME="PGLive CI" --build-arg COMPANY_ADDRESS="CI, India" frontend
      - name: Telugu PDF fonts exist in the production image
        run: |
          key=$(head -c 48 /dev/urandom | base64 | tr -d '\n/+=')
          docker run --rm -e SECRET_KEY="$key$key" -e JWT_SIGNING_KEY="$key$key" -e REQUIRE_PDF_FONTS=1 \
            pglive-api:local python manage.py test apps.billing.tests.test_receipt_pdf_fonts --noinput
      - name: BFF -> Django origin-signature integration
        run: bash ci/integration/run.sh
      - name: Scan images (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: pglive-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: pglive-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
